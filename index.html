<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>จองคิว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --paper:#F4F7F6; --surface:#FFFFFF; --ink:#1D2A2E; --muted:#5A686B;
    --line:#D6DFDD; --teal:#1F6F68; --pick:#E2EFEC; --rose:#9C3D53;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--paper)}
  body{color:var(--ink);font-family:"Noto Sans Thai Looped",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  .top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px 0}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--pick)}
  .top h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.01em;line-height:1.3}
  .tabs{display:flex;gap:24px}
  .tabs button{background:none;border:0;padding:6px 0 10px;color:var(--muted);border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--teal)}

  main{max-width:560px;margin:0 auto;padding:4px 20px 40px}
  .block{margin-top:24px;scroll-margin-top:var(--hdr,96px)}
  h2{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:1rem;font-weight:600}
  h2 em{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-style:normal;font-size:.8rem;font-weight:600}
  h2.done-step em{background:var(--pick);color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}

  .services{display:grid;gap:10px}
  .opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
  .opt strong{display:block;font-size:1.08rem;font-weight:600}
  .opt span{display:block;color:var(--muted);font-size:.9rem}

  /* ---- ปฏิทินเลือกวัน ---- */
  .cal{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px 12px}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-top b{font-size:1.08rem;font-weight:600}
  .nav{width:44px;height:44px;flex:none;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);
       display:grid;place-items:center;font-size:1.2rem;line-height:1}
  .nav:disabled{opacity:.3;cursor:default}
  .wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wd span{text-align:center;font-size:.78rem;color:var(--muted);padding-bottom:4px}
  .d{aspect-ratio:1/1;border:0;border-radius:12px;background:none;color:var(--ink);
     display:flex;align-items:center;justify-content:center;font-size:1.05rem;position:relative}
  .d:disabled{color:#C5D0CE;cursor:default}
  .d.free{background:var(--pick);color:var(--teal);font-weight:700}
  .d.full{background:#EEF1F0;color:#9AA8A5;text-decoration:line-through}
  .d[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
  .d.today::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:currentColor}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:.82rem;color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}

  .period{margin:16px 0 8px;font-size:.9rem;color:var(--muted)}
  .times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .time{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 0;
        font-size:1.1rem;font-weight:600}

  .opt[aria-pressed="true"],.day[aria-pressed="true"],.time[aria-pressed="true"]{background:var(--pick);border-color:var(--teal);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
  .opt[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--teal)}
  .opt[aria-pressed="true"] strong::after{content:" ✓";font-size:.95em}

  .ticket{display:flex;align-items:center;gap:16px;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--teal);border-radius:14px;padding:14px 16px}
  .ticket .num{min-width:58px;text-align:center;font-size:2.6rem;font-weight:700;line-height:1}
  .ticket .num small{display:block;margin-top:6px;font-size:.8rem;font-weight:500;color:var(--muted)}
  .ticket .info strong{display:block;font-weight:600}
  .ticket .info span{display:block;font-size:.92rem;color:var(--muted)}

  label.field{display:block;margin-top:14px;font-size:.95rem;font-weight:500}
  input[type=text],input[type=tel],textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
  input:focus,textarea:focus{border-color:var(--teal)}
  textarea{resize:vertical}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.9rem;color:var(--muted)}
  .consent input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--teal)}

  .primary{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-size:1.05rem;font-weight:600}
  .primary:disabled{opacity:.5;cursor:default}
  .secondary{display:block;width:100%;margin-top:10px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500}
  .text-btn{margin-top:9px;padding:8px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--rose);font-size:.92rem;font-weight:500}
  .error{min-height:1em;margin:12px 0 0;color:var(--rose);font-size:.92rem}
  .hint{display:block;margin-top:6px;font-size:.85rem;color:var(--muted)}
  .empty{margin:28px 0 0;color:var(--muted)}
  .item{margin-top:14px}

  .done{margin-top:28px}
  .done h2{font-size:1.3rem;margin-bottom:14px}
  .done p{color:var(--muted)}

  .foot{max-width:560px;margin:34px auto 0;padding:22px 20px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
  .foot h3{margin:0 0 10px;font-size:.95rem;font-weight:600;color:var(--ink)}
  .foot dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 16px}
  .foot dt{color:var(--muted)}
  .foot dd{margin:0;color:var(--ink)}
  .foot a{color:var(--teal)}
  .foot .call{display:inline-block;margin-top:2px;padding:11px 20px;border-radius:999px;background:var(--teal);color:#fff;font-weight:600;text-decoration:none}

  .loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(244,247,246,.85);font-weight:500}
  @media (prefers-reduced-motion:no-preference){
    .pop{animation:pop .35s ease-out}
    @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img id="logo" alt="" hidden>
    <h1 id="clinic"></h1>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="book" aria-selected="true">จองคิว</button>
    <button role="tab" data-tab="mine" aria-selected="false">นัดของฉัน</button>
  </nav>
</header>

<main>
  <section id="view-book">
    <div class="block">
      <h2><em>1</em>เลือกบริการ</h2>
      <div id="services" class="services"></div>
    </div>
    <div class="block" id="date-block" hidden>
      <h2><em>2</em>เลือกวัน</h2>
      <div id="dates" class="dates"></div>
    </div>
    <div class="block" id="time-block" hidden>
      <h2><em>3</em>เลือกเวลา</h2>
      <div id="times"></div>
    </div>
    <div class="block" id="form-block" hidden>
      <h2><em>4</em>ข้อมูลผู้จอง</h2>
      <div id="summary"></div>
      <label class="field">ชื่อ-นามสกุล
        <input type="text" id="f-name" autocomplete="name" maxlength="60">
      </label>
      <label class="field">เบอร์โทร
        <input type="tel" id="f-phone" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="เบอร์ที่ติดต่อได้">
      </label>
      <label class="field">หมายเหตุถึงคลินิก (ไม่บังคับ)
        <textarea id="f-note" rows="2" maxlength="200"></textarea>
      </label>
      <label class="consent">
        <input type="checkbox" id="f-consent">
        <span>ยินยอมให้คลินิกเก็บชื่อ เบอร์โทร และบัญชี LINE ไว้ใช้นัดหมายและแจ้งเตือนนัดเท่านั้น</span>
      </label>
      <p id="form-error" class="error" role="alert"></p>
      <button id="submit" class="primary">ยืนยันการจอง</button>
    </div>
  </section>

  <section id="view-done" class="done" hidden>
    <h2>จองคิวแล้ว</h2>
    <div id="done-ticket"></div>
    <p>คลินิกจะส่งข้อความเตือนทาง LINE ในวันก่อนนัด</p>
    <button class="primary" id="go-mine">ดูนัดของฉัน</button>
    <button class="secondary" id="close">ปิดหน้านี้</button>
  </section>

  <section id="view-mine" hidden>
    <div id="mine"></div>
  </section>
</main>

<footer class="foot" id="foot" hidden>
  <h3>ติดต่อคลินิก</h3>
  <dl>
    <div style="display:contents"><dt>ที่อยู่</dt><dd id="f-addr"></dd></div>
    <div style="display:contents"><dt>โทร</dt><dd><a id="f-tel" href="#"></a></dd></div>
    <div style="display:contents"><dt>เวลาทำการ</dt><dd id="f-hours"></dd></div>
  </dl>
  <a class="call" id="f-call" href="#">โทรหาคลินิก</a>
  <p style="margin:18px 0 0">หากต้องการเลื่อนนัดหรือสอบถามเพิ่มเติม พิมพ์ข้อความในแชทไว้ได้เลย</p>
</footer>

<div id="loading" class="loading">กำลังโหลด…</div>

<script>
/* ============ ตั้งค่า ============ */
const LIFF_ID     = '2011807177-FiexSlWR';
const API_URL     = 'https://script.google.com/macros/s/AKfycbzP71oK7LZGPpp_5RiWJKLQFGTsdlYCn8WldUpIvJGAyoUkj2lfQyHLPnVkAbALZbsnbA/exec';
const CLINIC_NAME = 'ทันตกรรม รพสต ตลาดบึง';

/* ข้อมูลท้ายหน้า — แก้ให้ตรงกับคลินิก */
const CLINIC_LOGO  = '';                       // ใส่ลิงก์รูปโลโก้ ถ้าไม่มีเว้นว่างไว้
const CLINIC_ADDR  = [
  'โรงพยาบาลส่งเสริมสุขภาพตำบลตลาดบึง',
  'เลขที่ 35 ม.7 ต.บึง อ.ศรีราชา',
  'จ.ชลบุรี 20230'
];
const CLINIC_MAP   = 'https://maps.google.com/?q=32F5%2BM9X+บึง+ศรีราชา+ชลบุรี';
const CLINIC_TEL   = '0642297385';
const CLINIC_HOURS = [
  'อุดฟัน / ขูดหินปูน — จันทร์, อังคาร 08.30–11.00 น. และ 13.00–14.30 น.',
  'ถอนฟัน — วันศุกร์ สัปดาห์ที่ 1 และ 3 ของเดือน 09.00–12.00 น.'
];
/* ================================ */

const $ = id => document.getElementById(id);
const WD_SHORT = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const WD_FULL  = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let idToken = null, services = [], minHours = 3;
const st = { svc: null, days: [], date: null, time: null, month: null };

/* ---------- ตัวช่วย ---------- */
function parts(ds){ const [y,m,d] = ds.split('-').map(Number); return { y, m, d, w: new Date(Date.UTC(y,m-1,d)).getUTCDay() }; }
function fullDate(ds){ const p = parts(ds); return `วัน${WD_FULL[p.w]}ที่ ${p.d} ${MON[p.m-1]} ${p.y+543}`; }
function endTime(t, min){ const [h,m] = t.split(':').map(Number); const n = h*60+m+min; return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }

function el(tag, props = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
}

function loading(on){ $('loading').hidden = !on; }
async function withLoading(fn){ loading(true); try { return await fn(); } finally { loading(false); } }

const DRAFT_KEY = 'booking-draft';

function saveDraft(){
  try {
    sessionStorage.setItem(DRAFT_KEY, JSON.stringify({
      svc: st.svc?.id, date: st.date, time: st.time,
      name: $('f-name').value, phone: $('f-phone').value,
      note: $('f-note').value, consent: $('f-consent').checked
    }));
  } catch (_) {}
}

function readDraft(){
  try {
    const raw = sessionStorage.getItem(DRAFT_KEY);
    sessionStorage.removeItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

/* หน้าเปิดค้างไว้นาน แล้วบัตรผ่านของ LINE หมดอายุ — ต่ออายุให้เองครั้งเดียว */
async function renewSession(){
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return false; }
  saveDraft();
  location.reload();
  return false;
}

async function api(action, data = {}, retried = false){
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, idToken, ...data })
    });
  } catch (_) {
    throw new Error('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
  const json = await res.json().catch(() => ({ ok:false, error:'ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง' }));
  if (!json.ok) {
    if (!retried && /หมดเวลาใช้งาน/.test(json.error || '')) {
      await renewSession();
      throw new Error('กำลังต่ออายุการใช้งาน กรุณารอสักครู่…');
    }
    throw new Error(json.error);
  }
  return json.data;
}

function ticket(b, extraClass = ''){
  const p = parts(b.date);
  return el('div', { class: 'ticket ' + extraClass },
    el('div', { class: 'num' }, String(p.d), el('small', {}, MON[p.m-1])),
    el('div', { class: 'info' },
      el('strong', {}, b.service),
      el('span', {}, fullDate(b.date)),
      el('span', {}, `เวลา ${b.time}–${endTime(b.time, b.minutes)} น.`)));
}

/* ---------- ขั้นตอนจอง ---------- */
function renderServices(){
  $('services').replaceChildren(...services.map(s =>
    el('button', { class: 'opt', 'aria-pressed': String(st.svc?.id === s.id), onclick: () => pickService(s) },
      el('strong', {}, s.name),
      el('span', {}, s.desc))));
}

function markSteps(){
  const h = n => document.querySelectorAll('#view-book h2')[n];
  h(0).classList.toggle('done-step', !!st.svc);
  h(1).classList.toggle('done-step', !!st.date);
  h(2).classList.toggle('done-step', !!st.time);
}

async function pickService(s){
  Object.assign(st, { svc: s, date: null, time: null, days: [], month: null });
  renderServices();
  markSteps();
  $('time-block').hidden = true;
  $('form-block').hidden = true;
  try {
    st.days = await withLoading(() => api('slots', { service: s.id }));
  } catch (e) { alert(e.message); return; }
  renderDates();
  $('date-block').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const monthOf = ds => ds.slice(0, 7);
const addMonth = (key, n) => {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + n, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2,'0')}`;
};

function renderDates(){
  $('date-block').hidden = false;
  if (!st.days.length){
    $('dates').replaceChildren(el('p', { class: 'empty' }, 'ช่วงนี้ยังไม่เปิดรับคิว ทักแชทสอบถามคลินิกได้'));
    return;
  }

  const months = [...new Set(st.days.map(d => monthOf(d.date)))].sort();
  if (!st.month || !months.includes(st.month)) st.month = monthOf(st.date || st.days[0].date);
  const idx = months.indexOf(st.month);
  const [y, m] = st.month.split('-').map(Number);
  const today = new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10);

  const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const total = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const byDate = Object.fromEntries(st.days.map(d => [d.date, d]));

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(el('span'));
  for (let n = 1; n <= total; n++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    const day = byDate[ds];
    const free = day && day.times.length;
    cells.push(el('button', {
        class: 'd' + (free ? ' free' : day ? ' full' : '') + (ds === today ? ' today' : ''),
        disabled: !free,
        'aria-pressed': String(st.date === ds),
        'aria-label': fullDate(ds) + (free ? ` ว่าง ${day.times.length} คิว` : day ? ' คิวเต็ม' : ' ไม่เปิดให้บริการ'),
        onclick: () => pickDate(ds)
      }, String(n)));
  }

  $('dates').replaceChildren(
    el('div', { class: 'cal' },
      el('div', { class: 'cal-top' },
        el('button', { class: 'nav', disabled: idx <= 0, 'aria-label': 'เดือนก่อนหน้า',
          onclick: () => { st.month = months[idx - 1]; renderDates(); } }, '‹'),
        el('b', {}, `${MON_FULL[m-1]} ${y + 543}`),
        el('button', { class: 'nav', disabled: idx >= months.length - 1, 'aria-label': 'เดือนถัดไป',
          onclick: () => { st.month = months[idx + 1]; renderDates(); } }, '›')),
      el('div', { class: 'wd' }, WD_SHORT.map(w => el('span', {}, w))),
      el('div', { class: 'days' }, cells),
      el('div', { class: 'legend' },
        el('span', {}, el('i', { style: 'background:#E2EFEC' }), 'มีคิวว่าง'),
        el('span', {}, el('i', { style: 'background:#EEF1F0' }), 'คิวเต็ม'))));
}

function pickDate(ds){
  st.date = ds; st.time = null;
  renderDates(); renderTimes(); markSteps();
  $('form-block').hidden = true;
  $('time-block').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderTimes(){
  const day = st.days.find(d => d.date === st.date);
  if (!day) { $('time-block').hidden = true; return; }
  $('time-block').hidden = false;
  const btn = t => el('button', { class: 'time', 'aria-pressed': String(st.time === t), onclick: () => pickTime(t) }, t);
  const morning = day.times.filter(t => t < '12:00'), afternoon = day.times.filter(t => t >= '12:00');
  const group = (label, list) => list.length ? [el('p', { class: 'period' }, label), el('div', { class: 'times' }, list.map(btn))] : [];
  $('times').replaceChildren(...group('ช่วงเช้า', morning), ...group('ช่วงบ่าย', afternoon));
}

function pickTime(t){
  st.time = t;
  renderTimes(); markSteps();
  $('summary').replaceChildren(ticket({ date: st.date, time: t, minutes: st.svc.minutes, service: st.svc.name }));
  $('form-error').textContent = '';
  $('form-block').hidden = false;
  $('form-block').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function submit(){
  const err = m => { $('form-error').textContent = m; };
  err('');
  const name = $('f-name').value.trim();
  const phone = $('f-phone').value.replace(/\D/g, '');
  const note = $('f-note').value.trim();
  const consent = $('f-consent').checked;
  if (!name) return err('กรอกชื่อ-นามสกุล');
  if (!/^0\d{8,9}$/.test(phone)) return err('กรอกเบอร์โทรให้ถูกต้อง เช่น 0812345678');
  if (!consent) return err('กดยินยอมการเก็บข้อมูลก่อนยืนยัน');

  $('submit').disabled = true;
  try {
    const b = await withLoading(() => api('book', { service: st.svc.id, date: st.date, time: st.time, name, phone, note, consent }));
    showDone(b);
    try {
      if (liff.isInClient()) await liff.sendMessages([{ type: 'text',
        text: `จองคิวแล้ว\n${b.service}\n${fullDate(b.date)}\nเวลา ${b.time}–${endTime(b.time, b.minutes)} น.` }]);
    } catch (_) {}
  } catch (e) {
    err(e.message);
    if (e.message.includes('ถูกจอง')) {
      st.days = await api('slots', { service: st.svc.id }).catch(() => st.days);
      st.time = null; renderDates(); renderTimes();
    }
  } finally {
    $('submit').disabled = false;
  }
}

function showDone(b){
  $('done-ticket').replaceChildren(ticket(b, 'pop'));
  $('view-book').hidden = true;
  $('view-done').hidden = false;
  window.scrollTo(0, 0);
}

function resetBooking(){
  Object.assign(st, { svc: null, days: [], date: null, time: null, month: null });
  ['f-name','f-phone','f-note'].forEach(id => $(id).value = '');
  $('f-consent').checked = false;
  ['date-block','time-block','form-block'].forEach(id => $(id).hidden = true);
  renderServices();
  markSteps();
}

/* ---------- นัดของฉัน ---------- */
async function loadMine(){
  const box = $('mine');
  let list;
  try { list = await withLoading(() => api('mine')); }
  catch (e) { box.replaceChildren(el('p', { class: 'empty' }, e.message)); return; }

  if (!list.length){
    box.replaceChildren(
      el('p', { class: 'empty' }, 'ยังไม่มีนัดที่จะถึง'),
      el('button', { class: 'primary', onclick: () => switchTab('book') }, 'จองคิว'));
    return;
  }
  box.replaceChildren(el('div', { class: 'block' }, el('h2', {}, 'นัดที่จะถึง'),
    list.map(b => el('div', { class: 'item' }, ticket(b),
      b.canCancel
        ? el('button', { class: 'text-btn', onclick: () => cancel(b) }, 'ยกเลิกนัดนี้')
        : el('span', { class: 'hint' }, `ยกเลิกออนไลน์ได้ก่อนนัด ${minHours} ชม. หากต้องการเลื่อนหรือยกเลิก ทักแชทคลินิก`)))));
}

async function cancel(b){
  if (!confirm(`ยกเลิกนัด ${b.service}\n${fullDate(b.date)} เวลา ${b.time} น.?`)) return;
  try { await withLoading(() => api('cancel', { id: b.id })); }
  catch (e) { alert(e.message); }
  loadMine();
}

/* ---------- แท็บ ---------- */
function switchTab(tab){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('view-mine').hidden = tab !== 'mine';
  $('view-done').hidden = true;
  $('view-book').hidden = tab !== 'book';
  if (tab === 'book') resetBooking();
  if (tab === 'mine') loadMine();
  window.scrollTo(0, 0);
}

/* ---------- เริ่มต้น ---------- */
async function restoreDraft(){
  const d = readDraft();
  if (!d || !d.svc) return;
  const svc = services.find(x => x.id === d.svc);
  if (!svc) return;
  await pickService(svc);
  if (d.date && st.days.some(x => x.date === d.date)){
    pickDate(d.date);
    const day = st.days.find(x => x.date === d.date);
    if (d.time && day.times.includes(d.time)) pickTime(d.time);
  }
  $('f-name').value  = d.name  || '';
  $('f-phone').value = d.phone || '';
  $('f-note').value  = d.note  || '';
  $('f-consent').checked = !!d.consent;
}

function sizeHeader(){
  document.documentElement.style.setProperty('--hdr',
    (document.querySelector('.top').offsetHeight + 12) + 'px');
}

const lines = arr => arr.flatMap((t, i) => i ? [el('br'), t] : [t]);

function renderFooter(){
  $('f-addr').replaceChildren(
    ...lines([].concat(CLINIC_ADDR)),
    ...(CLINIC_MAP ? [el('br'), el('a', { href: CLINIC_MAP, target: '_blank', rel: 'noopener' }, 'ดูแผนที่')] : []));
  $('f-hours').replaceChildren(...lines(CLINIC_HOURS));
  const tel = $('f-tel'), call = $('f-call');
  if (CLINIC_TEL){
    tel.textContent = CLINIC_TEL;
    tel.href = 'tel:' + CLINIC_TEL.replace(/\D/g, '');
    call.href = tel.href;
    call.hidden = false;
  } else {
    tel.replaceWith(document.createTextNode('ทักแชทสอบถามได้เลย'));
    call.hidden = true;
  }
  $('foot').hidden = false;
}

async function init(){
  $('clinic').textContent = CLINIC_NAME;
  if (CLINIC_LOGO){ const g = $('logo'); g.src = CLINIC_LOGO; g.hidden = false; }
  renderFooter();
  sizeHeader();
  addEventListener('resize', sizeHeader);
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('submit').addEventListener('click', submit);
  $('go-mine').addEventListener('click', () => switchTab('mine'));
  $('close').addEventListener('click', () => liff.isInClient() ? liff.closeWindow() : switchTab('book'));

  try {
    if (LIFF_ID.startsWith('ใส่') || API_URL.startsWith('ใส่')) throw new Error('ยังไม่ได้ใส่ LIFF_ID และ API_URL ในไฟล์ index.html');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    const data = await api('services');
    services = data.services;
    minHours = data.minHoursBefore;
    renderServices();
    await restoreDraft();
    // เปิดแท็บ "นัดของฉัน" ได้ตรงๆ ด้วยลิงก์ที่ลงท้าย ?tab=mine
    const wanted = new URLSearchParams(location.search).get('tab')
      || new URLSearchParams((liff.getContext()?.liffUrl || '').split('?')[1] || '').get('tab');
    if (wanted === 'mine') switchTab('mine');
  } catch (e) {
    $('view-book').replaceChildren(el('p', { class: 'empty' }, e.message));
  } finally {
    loading(false);
  }
}
init();
</script>
</body>
</html>
