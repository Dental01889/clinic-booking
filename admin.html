<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตารางคิว (ผู้ดูแล)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#EEF1F0; --card:#FFFFFF; --ink:#16211F; --muted:#5E6B69;
    --rule:#D3DCDA; --teal:#17635C; --teal-soft:#E3EFED;
    --rose:#9A2F46; --rose-soft:#FBE7EB; --amber:#8A5B10; --amber-soft:#FBEFD8;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .wrap{max-width:620px;margin:0 auto;padding:0 20px 80px}

  /* header + date strip */
  .top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--rule)}
  .top .wrap{padding-top:14px;padding-bottom:0}
  .eyebrow{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .eyebrow h1{margin:0;font-size:1.1rem;font-weight:700}
  .eyebrow span{font-size:.85rem;color:var(--muted)}
  .cal{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:12px 10px 10px;margin-bottom:12px}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-top b{font-size:1.02rem;font-weight:600}
  .nav{width:40px;height:40px;flex:none;border:1.5px solid var(--rule);border-radius:50%;
       background:var(--card);display:grid;place-items:center;font-size:1.15rem;line-height:1}
  .nav:disabled{opacity:.3;cursor:default}
  .wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .wd span{text-align:center;font-size:.74rem;color:var(--muted);padding-bottom:3px}
  .d{position:relative;aspect-ratio:1/1;border:0;border-radius:10px;background:none;color:var(--ink);
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
     font-size:1rem;font-variant-numeric:tabular-nums}
  .d:disabled{color:#C5D0CE;cursor:default}
  .d i{font-style:normal;font-size:.62rem;line-height:1;color:var(--muted)}
  .d.open{background:#F1F5F4}
  .d.has{background:var(--teal-soft);color:var(--teal);font-weight:700}
  .d.has i{color:var(--teal)}
  .d.shut{background:var(--amber-soft);color:var(--amber)}
  .d.shut i{color:var(--amber)}
  .d[aria-current="date"]{background:var(--teal);color:#fff;font-weight:700}
  .d[aria-current="date"] i{color:#CFE3E0}
  .d.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
  .d.extra{box-shadow:inset 0 0 0 1.5px #D5DEDC}
  .d.extra:not([aria-current]){color:#6E7F7C}
  .banner.info{background:#EAF2F8;border-left-color:#2C6A93;color:#22516F}
  #dlg-text{white-space:pre-line}
  .rs-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--rule)}
  .rs-row:first-child{border-top:0}
  .rs-row b{display:block;font-weight:600}
  .rs-row small{color:var(--muted);font-size:.84rem}
  .rs-row select{margin-top:0}
  .rs-list{margin-top:12px;max-height:46vh;overflow:auto}
  .linkbtn{display:block;width:100%;margin-top:10px;border:0;background:none;color:var(--muted);font-size:.88rem;text-decoration:underline;padding:6px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.78rem;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* day head */
  .dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:22px 0 4px}
  .dayhead h2{margin:0;flex:1 1 auto;font-size:1.15rem;font-weight:700}
  .counts{margin:0 0 12px;color:var(--muted);font-size:.92rem}
  .counts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .shutbtn{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 15px;font-size:.9rem;font-weight:500}
  .addbtn{border:0;background:var(--teal);color:#fff;border-radius:999px;padding:8px 17px;font-size:.9rem;font-weight:600}
  .addbtn:disabled{opacity:.4;cursor:default}
  .shutbtn.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:8px;padding:11px 14px;margin-bottom:18px;color:var(--amber);font-size:.92rem}

  /* ตารางเวลา */
  .svcpick{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:.92rem;color:var(--muted)}
  .svcpick select{flex:1;padding:9px 12px;font:inherit;color:var(--ink);background:var(--card);
    border:1.5px solid var(--rule);border-radius:10px}
  .slots{border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--card)}
  .slot{display:grid;grid-template-columns:84px 1fr 44px;align-items:stretch;width:100%;
        min-height:62px;border:0;border-top:1px solid var(--rule);background:var(--card);
        text-align:left;padding:0;font:inherit;color:inherit}
  .slot:first-child{border-top:0}
  .slot .t{display:flex;align-items:center;justify-content:center;padding:0 8px;
           font-weight:600;font-variant-numeric:tabular-nums;border-right:1px solid var(--rule)}
  .slot .n{display:flex;flex-direction:column;justify-content:center;gap:2px;
           padding:10px 14px;min-width:0}
  .slot .n b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .n small{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .n small a{color:inherit}
  .slot .side{display:flex;align-items:center;justify-content:center}
  .slot.vacant{cursor:pointer}
  .slot.vacant .n{color:var(--muted)}
  .slot.vacant .side{color:#BFCBC8;font-size:1.2rem}
  .slot.vacant[aria-pressed="true"]{background:var(--teal-soft)}
  .slot.vacant[aria-pressed="true"] .n,
  .slot.vacant[aria-pressed="true"] .side{color:var(--teal);font-weight:600}
  .slot.taken .t{box-shadow:inset 3px 0 0 var(--teal)}
  .slot.off .n b{text-decoration:line-through;color:var(--muted)}
  .slot.off .t{box-shadow:inset 3px 0 0 var(--rule)}
  .slot.blocked .n{color:#A9B5B3}
  .drop{width:30px;height:30px;border:0;border-radius:50%;background:none;color:#B9C4C2;
        font-size:1rem;line-height:1;cursor:pointer}
  .drop:hover{background:var(--rose-soft);color:var(--rose)}
  .selbar{position:sticky;bottom:12px;margin-top:14px;display:flex;gap:10px;align-items:center;
          background:var(--teal);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;
          box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .selbar span{flex:1;font-weight:500;font-size:.94rem}
  .selbar button{border:0;border-radius:999px;padding:9px 18px;background:#fff;color:var(--teal);font-weight:700}
  .empty{margin:26px 0;color:var(--muted)}

  /* dialog */
  dialog{width:min(420px,calc(100vw - 40px));border:0;border-radius:14px;padding:22px;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(16,30,28,.5)}
  dialog h3{margin:0 0 6px;font-size:1.05rem}
  dialog p{margin:0 0 16px;color:var(--muted);font-size:.93rem}
  dialog select{width:100%;margin-top:5px;padding:11px 13px;font:inherit;color:var(--ink);
    background:var(--card);border:1.5px solid var(--rule);border-radius:9px}
  .person{display:grid;grid-template-columns:1fr 128px 34px;grid-template-areas:'nm when x' 'ph ph x';gap:8px;align-items:center;margin-top:9px}
  .person .nm{grid-area:nm} .person .when{grid-area:when} .person .x{grid-area:x} .person .ph{grid-area:ph}
  #ad-people > div + div{margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}
  .person .x{width:34px;height:40px;border:0;background:none;color:var(--muted);font-size:1.15rem;line-height:1}
  .person .x:hover{color:var(--rose)}
  .morebtn{margin-top:12px;width:100%;padding:11px;border:1.5px dashed var(--rule);border-radius:11px;
    background:none;color:var(--teal);font-weight:600}
  .morebtn:disabled{opacity:.4;cursor:default;color:var(--muted)}
  .person .when{text-align:center;font-size:.84rem;white-space:nowrap;font-weight:600;color:var(--teal);
    background:var(--teal-soft);border-radius:9px;padding:11px 0;font-variant-numeric:tabular-nums}
  dialog input{width:100%;padding:11px 13px;font:inherit;border:1.5px solid var(--rule);border-radius:9px;background:#fff;color:var(--ink)}
  dialog label{display:block;margin-top:13px;font-size:.9rem;font-weight:500}
  dialog label input{margin-top:5px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.92rem;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
  .err{min-height:1em;margin-top:12px;color:var(--rose);font-size:.9rem}
  .acts{display:flex;gap:10px;margin-top:18px}
  .acts button{flex:1;padding:11px;border-radius:9px;border:1.5px solid var(--rule);background:var(--card);font-weight:500}
  .acts .go{border:0;background:var(--rose);color:#fff;font-weight:600}
  .acts .go.safe{background:var(--teal)}

  .loginbox{max-width:360px;margin:56px auto 0;background:var(--card);border:1.5px solid var(--rule);
    border-radius:16px;padding:26px 22px}
  .loginbox h2{margin:0 0 6px;font-size:1.15rem}
  .loginbox p{margin:0 0 18px;color:var(--muted);font-size:.93rem}
  .loginbox input{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--card);
    border:1.5px solid var(--rule);border-radius:10px}
  .loginbox .primary{width:100%;margin-top:4px;padding:14px;border:0;border-radius:11px;
    background:var(--teal);color:#fff;font-size:1.02rem;font-weight:600}
  .loginbox .primary:disabled{opacity:.5}
  .loginbox .small{margin:14px 0 0;font-size:.84rem}
  #logout{margin-left:auto;background:none;border:0;padding:4px;color:var(--muted);
    font-size:.86rem;text-decoration:underline}


  /* จอกว้าง (โน้ตบุ๊ก/คอม): ปฏิทินซ้าย ตารางคิวขวา */
  @media (min-width:960px){
    .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;
            max-width:1080px;margin:0 auto;padding:0 24px;align-items:start}
    .layout:has(#main[hidden]){display:block;max-width:none;padding:0}
    .layout .wrap{max-width:none;margin:0;padding-left:0;padding-right:0}
    .layout .top{position:sticky;top:0;border-bottom:0;max-height:100vh;overflow:auto}
    .layout #main{padding-top:14px}
    .layout #main .dayhead{margin-top:0}
    .layout .d{aspect-ratio:auto;height:72px;font-size:1.1rem}
    .layout .slot{min-height:58px}
  }

  /* ค้นหาคนไข้ */
  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;padding:11px 14px 11px 38px;font:inherit;color:var(--ink);background:var(--card);
    border:1.5px solid var(--rule);border-radius:12px}
  .search::before{content:"";position:absolute;left:14px;top:50%;width:11px;height:11px;margin-top:-8px;
    border:2px solid var(--muted);border-radius:50%}
  .search::after{content:"";position:absolute;left:25px;top:50%;width:6px;height:2px;margin-top:4px;
    background:var(--muted);transform:rotate(45deg)}
  .results{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;margin-bottom:12px;
    max-height:min(420px,55vh);overflow:auto}
  .results .rhead{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
    font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--rule)}
  .results .rhead button{border:0;background:none;color:var(--teal);font-size:.84rem;font-weight:600;padding:2px 4px}
  .hit{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;width:100%;text-align:left;border:0;
    border-top:1px solid var(--rule);background:none;padding:10px 14px;font:inherit}
  .hit:first-of-type{border-top:0}
  .hit:hover{background:#F6F9F8}
  .hit .when{font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
  .hit .when small{display:block;font-weight:400;color:var(--muted)}
  .hit .who b{font-weight:600}
  .hit .who small{display:block;color:var(--muted);font-size:.82rem}
  .tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:.72rem;font-weight:600;vertical-align:1px}
  .tag.up{background:var(--teal-soft);color:var(--teal)}
  .tag.past{background:#EEF1F0;color:var(--muted)}
  .tag.off{background:var(--rose-soft);color:var(--rose)}
  .results .none{padding:14px;color:var(--muted);font-size:.9rem;margin:0}

  .printonly{display:none}
  @media print{
    @page{size:A4;margin:14mm}
    html,body{background:#fff}
    .top,#add,#shut,#print,#selbar,#svcpick,.slot .side,.toast,.loading,dialog,#banner{display:none!important}
    .layout{display:block!important;max-width:none!important;padding:0!important}
    .wrap{max-width:none!important;padding:0!important}
    #main{padding-top:0!important}
    .printonly{display:block;margin:0 0 2px;font-size:.95rem;color:#000}
    .dayhead{margin:0 0 2px}
    .counts{color:#000}
    .slots{border:1px solid #000;border-radius:0}
    .slot{grid-template-columns:80px 1fr;min-height:44px!important;border-top:1px solid #000;break-inside:avoid}
    .slot .t{border-right:1px solid #000;box-shadow:none!important;color:#000}
    .slot .n b,.slot .n small,.slot .n small a{color:#000;white-space:normal;text-decoration:none}
    .slot.vacant .n b{color:#999;font-weight:400}
  }
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100vw - 40px);z-index:30;background:#16211F;color:#fff;border-radius:10px;padding:11px 16px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(238,241,240,.85);font-weight:500}
  /* Dashboard appearance. Screen-only to preserve the original print layout. */
  @media screen{
    :root{
      --bg:#F4F7F6;--card:#FFFFFF;--ink:#19332D;--muted:#536B63;
      --rule:#D8E4DE;--teal:#1F6F68;--teal-soft:#E4F1ED;
      --rose:#96354C;--rose-soft:#FBEAF0;--amber:#805710;--amber-soft:#FFF3DB;
    }
    body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.7}
    button,input,select,textarea{font-family:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding:24px;align-items:start}
    .layout .wrap{max-width:none;margin:0;padding:0}
    .layout .top{position:static;background:transparent;border:0;max-height:none;overflow:visible}
    .layout .top .wrap{padding:0}
    .eyebrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 12px;margin-bottom:20px}
    .eyebrow h1{grid-column:1/-1;font-size:1.22rem;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
    .eyebrow span{justify-self:start;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:4px 11px;font-size:.83rem;font-weight:500}
    #logout{margin:0;min-height:44px;padding:8px 12px;background:var(--card);border:1px solid var(--rule);border-radius:10px;color:var(--muted);font-size:.85rem;text-decoration:none}
    #logout:hover{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}

    /* Search and patient results */
    .search{margin-bottom:15px}
    .search input{min-width:0;min-height:48px;padding:12px 14px 12px 40px;border-width:1px;border-radius:12px;font-size:16px;box-shadow:0 2px 6px rgba(22,55,43,.025)}
    .search input::placeholder{color:var(--muted);opacity:1}
    .search input:focus{border-color:var(--teal)}
    .search::before{left:15px;border-color:var(--teal)}
    .search::after{left:26px;background:var(--teal)}
    .results{margin-bottom:18px;border-width:1px;border-radius:14px;box-shadow:0 6px 18px rgba(22,55,43,.04)}
    .results .rhead{padding:11px 13px;background:#F2F7F4;font-size:.88rem;gap:10px;flex-wrap:wrap}
    .results .rhead button{padding:8px 9px;min-height:44px;border-radius:8px;font-size:.88rem}
    .results .rhead button:hover{background:var(--teal-soft)}
    .hit{grid-template-columns:88px minmax(0,1fr);gap:8px 12px;padding:15px 13px;min-height:68px}
    .hit .when{font-size:.88rem;line-height:1.6}
    .hit .who{min-width:0;overflow-wrap:anywhere}
    .hit .who b{font-size:.98rem;line-height:1.55}
    .hit .who small{font-size:.86rem;line-height:1.6;margin-top:3px}
    .hit:hover{background:#F0F7F3}
    .tag{margin-left:5px;padding:2px 8px;font-size:.76rem;line-height:1.5}
    .results .none{padding:18px 14px;font-size:.94rem;line-height:1.7}

    /* Calendar */
    .cal{padding:20px 14px 17px;background:var(--card);border:1px solid var(--rule);border-radius:18px;margin:0;box-shadow:0 6px 22px rgba(22,55,43,.035)}
    .cal-top{margin-bottom:18px;gap:8px}
    .cal-top b{font-size:1.12rem;font-weight:600;text-align:center;line-height:1.5}
    .nav{width:44px;height:44px;border-width:1px;font-size:1.3rem;background:#FBFDFC}
    .nav:not(:disabled):hover{border-color:var(--teal);background:var(--teal-soft)}
    .nav:disabled{opacity:.4}
    .wd,.days{gap:5px}
    .wd span{font-size:.83rem;font-weight:500;padding-bottom:10px}
    .d{min-height:43px;border-radius:11px;font-size:1.04rem;gap:3px;line-height:1.3}
    .d i{font-size:.72rem;line-height:1.25}
    .d.open{background:#F1F6F3}
    .d.has{background:var(--teal-soft)}
    .d.shut{background:var(--amber-soft)}
    .d:disabled{color:#82938B}
    .d:enabled:hover{box-shadow:inset 0 0 0 1.5px var(--teal)}
    .d[aria-current="date"]{background:var(--teal);color:#FFF;box-shadow:0 4px 10px rgba(31,111,104,.16)}
    .d[aria-current="date"] i{color:#E7F6F0}
    .d.today::after{width:4px;height:4px;bottom:5px}
    .legend{border-top:1px solid var(--rule);padding-top:14px;margin-top:17px;gap:8px 13px;font-size:.81rem;line-height:1.6}
    .legend i{width:12px;height:12px;vertical-align:-1px}

    /* Day heading and schedule */
    .layout #main{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:24px;box-shadow:0 6px 22px rgba(22,55,43,.035)}
    .layout #main .dayhead{margin:0 0 17px;gap:10px}
    .dayhead h2{flex:1 1 100%;font-size:1.3rem;line-height:1.5;font-weight:700;overflow-wrap:anywhere;margin-bottom:2px}
    .shutbtn,.addbtn{min-height:44px;border-radius:10px;padding:9px 15px;font-size:.89rem;line-height:1.5}
    .shutbtn{border-width:1px}
    .shutbtn:not(.on):hover{border-color:var(--teal);background:var(--teal-soft)}
    .addbtn{box-shadow:0 2px 6px rgba(31,111,104,.12)}
    .addbtn:not(:disabled):hover{background:#185E57}
    #print{background:#F4F8F6}
    .shutbtn.on{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
    .counts{padding:12px 15px;background:#F2F7F4;border:1px solid #E3ECE7;border-radius:11px;margin:0 0 18px;color:var(--muted);font-size:.98rem;line-height:1.7;overflow-wrap:anywhere}
    .counts b{color:var(--teal);font-weight:700}
    .svcpick{gap:12px;margin-bottom:18px;font-size:.95rem;line-height:1.6}
    .svcpick select{min-width:0;min-height:46px;padding:10px 12px;border-width:1px;border-radius:10px;font-size:16px}
    .banner{padding:13px 15px;border-radius:10px;margin-bottom:18px;font-size:.94rem;line-height:1.7}

const saveToken  = t => { try { localStorage.setItem(TOKEN_KEY, t); } catch (_) {} };
const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (_) {} };

const parts = ds => { const [y,m,d] = ds.split('-').map(Number); return { y, m, d, w: new Date(Date.UTC(y,m-1,d)).getUTCDay() }; };
const longDate = ds => { const p = parts(ds); return `วัน${WD_F[p.w]}ที่ ${p.d} ${MON[p.m-1]} ${p.y+543}`; };
const endOf = (t, min) => { const [h,m] = t.split(':').map(Number); const n = h*60+m+min; return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; };

function el(tag, props = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
}

function loading(on){ $('loading').hidden = !on; }
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4000);
}

async function api(action, data = {}){
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, idToken, adminToken, ...data })
    });
  } catch (_) {
    throw new Error('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
  const json = await res.json().catch(() => ({ ok:false, error:'ระบบขัดข้อง ลองใหม่อีกครั้ง' }));
  if (!json.ok) {
    // บัตรผ่านของ LINE หมดอายุเพราะเปิดหน้าค้างไว้นาน — ต่ออายุให้เอง
    if (/หมดเวลาเข้าสู่ระบบ/.test(json.error || '')) {
      adminToken = null; clearToken(); showLogin('หมดเวลาเข้าสู่ระบบ กรุณาใส่รหัสผ่านใหม่');
      throw new Error(json.error);
    }
    if (/หมดเวลาใช้งาน/.test(json.error || '')) {
      try {
        if (!liff.isLoggedIn()) liff.login({ redirectUri: location.href }); else location.reload();
      } catch (_) { showLogin('เปิดหน้านี้ผ่าน LINE ไม่ได้ กรุณาใส่รหัสผ่าน'); }
      throw new Error('กำลังต่ออายุการใช้งาน กรุณารอสักครู่…');
    }
    throw new Error(json.error);
  }
  return json.data;
}

/* ---------- ถามยืนยัน ---------- */
function ask({ title, text, confirm, placeholder, safe }){
  return new Promise(resolve => {
    const dlg = $('dlg');
    $('dlg-title').textContent = title;
    $('dlg-text').textContent = text;
    $('dlg-yes').textContent = confirm;
    $('dlg-yes').classList.toggle('safe', !!safe);
    const input = $('dlg-input');
    input.hidden = !placeholder;
    input.placeholder = placeholder || '';
    input.value = '';
    const done = v => { dlg.close(); resolve(v); };
    $('dlg-yes').onclick = () => done({ ok: true, text: input.value.trim() });
    $('dlg-no').onclick = () => done(null);
    dlg.onclose = () => resolve(null);
    dlg.showModal();
    if (placeholder) input.focus();
  });
}

/* ---------- ปฏิทินเลือกวัน ---------- */
const WD_MIN = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const monthOf = ds => ds.slice(0, 7);
let calMonth = null;

function renderStrip(){
  if (!days.length){ $('strip').replaceChildren(); return; }
  const months = [...new Set(days.map(d => monthOf(d.date)))].sort();
  if (!calMonth || !months.includes(calMonth)) calMonth = monthOf(current || today || days[0].date);
  if (!months.includes(calMonth)) calMonth = months[0];

  const idx = months.indexOf(calMonth);
  const [y, m] = calMonth.split('-').map(Number);
  const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const total = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const byDate = Object.fromEntries(days.map(d => [d.date, d]));

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(el('span'));
  for (let n = 1; n <= total; n++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    const d = byDate[ds];
    const cls = ['d'];
    if (ds === today) cls.push('today');
    if (d) cls.push(d.holiday ? 'shut' : d.count ? 'has' : d.extra ? 'extra' : 'open');
    cells.push(el('button', {
        class: cls.join(' '), disabled: !d,
        'aria-current': ds === current ? 'date' : false,
        'aria-label': longDate(ds) + (!d ? ' ไม่เปิดบริการ'
          : d.holiday ? ' ปิดทำการ' : d.extra && !d.count ? ' วันนัดชดเชย (หมอลงคิวเอง)' : d.count ? ` ${d.count} นัด` + (d.total ? ` จาก ${d.total} คิว` : '') : ' ยังไม่มีนัด'),
        onclick: () => openDay(ds)
      },
      String(n),
      el('i', {}, !d ? '' : d.holiday ? 'ปิด'
        : d.total ? `${d.count}/${d.total}` : (d.count ? String(d.count) : ''))));
  }

  $('strip').replaceChildren(
    el('div', { class: 'cal' },
      el('div', { class: 'cal-top' },
        el('button', { class: 'nav', disabled: idx <= 0, 'aria-label': 'เดือนก่อนหน้า',
          onclick: () => { calMonth = months[idx - 1]; renderStrip(); } }, '‹'),
        el('b', {}, `${MON_FULL[m-1]} ${y + 543}`),
        el('button', { class: 'nav', disabled: idx >= months.length - 1, 'aria-label': 'เดือนถัดไป',
          onclick: () => { calMonth = months[idx + 1]; renderStrip(); } }, '›')),
      el('div', { class: 'wd' }, WD_MIN.map(w => el('span', {}, w))),
      el('div', { class: 'days' }, cells),
      el('div', { class: 'legend' },
        el('span', {}, el('i', { style: 'background:#E3EFED' }), 'มีนัด'),
        el('span', {}, el('i', { style: 'background:#F1F5F4' }), 'ยังไม่มีนัด'),
        el('span', {}, el('i', { style: 'background:#FBEFD8' }), 'ปิดทำการ'),
        el('span', {}, el('i', { style: 'box-shadow:inset 0 0 0 1.5px #D5DEDC' }), 'พฤหัส (หมอลงคิวเอง)'))));
}

/* ---------- ตารางของวัน ---------- */
async function openDay(ds){
  current = ds;
  calMonth = monthOf(ds);
  renderStrip();
  let data;
  try { loading(true); data = await api('adminDay', { date: ds }); }
  catch (e) { toast(e.message); return; }
  finally { loading(false); }
  renderDay(data);
  $('main').hidden = false;
}

let dayData = null, svcId = null, picked = [];

function renderDay(data){
  dayData = data;
  picked = [];
  $('dayname').textContent = longDate(data.date);

  const shut = $('shut');
  shut.textContent = data.holiday ? 'เปิดทำการอีกครั้ง' : 'ปิดทำการวันนี้';
  shut.classList.toggle('on', data.holiday);
  shut.onclick = () => toggleHoliday(data);
  shut.hidden = !!data.extra && !data.holiday;     // วันชดเชยคนไข้จองเองไม่ได้อยู่แล้ว
  $('add').hidden = true;

  const live = data.bookings.filter(b => !b.cancelled);
  const counts = [];
  if (data.capacity.length){
    data.capacity.forEach((c, i) => {
      if (i) counts.push(' · ');
      counts.push(`${c.name} `, el('b', {}, `${c.booked}/${c.total}`), ' คิว');
    });
  } else {
    counts.push(el('b', {}, String(live.length)), ' นัด (นอกวันให้บริการปกติ)');
  }
  $('counts').replaceChildren(...counts);

  $('banner').hidden = !data.holiday && !data.extra;
  $('banner').classList.toggle('info', !data.holiday && !!data.extra);
  $('bannertext').textContent = data.holiday
    ? (live.length ? `ปิดทำการ แต่ยังมี ${live.length} นัดค้างอยู่ — ยกเลิกทีละรายการเพื่อแจ้งคนไข้`
                   : 'ปิดทำการ คนไข้จะไม่เห็นวันนี้ในหน้าจอง')
    : 'วันนัดชดเชย — คนไข้จองเองไม่ได้ หมอลงคิวให้เท่านั้น';

  if (!svcId || !data.capacity.some(c => c.id === svcId))
    svcId = (data.capacity[0] || {}).id || null;

  $('svcpick').replaceChildren(...(data.capacity.length > 1
    ? [el('label', { class: 'svcpick' }, 'บริการ',
        el('select', { onchange: e => { svcId = e.target.value; renderDay(dayData); } },
          data.capacity.map(c => el('option', { value: c.id, selected: c.id === svcId }, c.name))))]
    : []));

  renderSlots();
  renderWaitlist(data.waitlist || []);
}

function renderWaitlist(list){
  if (!list.length){ $('waitlist').replaceChildren(); return; }
  $('waitlist').replaceChildren(el('div', { class: 'waitbox' },
    el('h3', {}, `รอคิว ${list.length} คน`),
    el('p', {}, 'มีคนยกเลิกเมื่อไร ระบบส่ง LINE บอก 3 คนแรกให้เอง หรือโทรเรียกเองก็ได้'),
    el('ul', {}, list.map(w => el('li', {},
      el('b', {}, w.name || '—'), ' · ',
      w.phone ? el('a', { href: 'tel:' + w.phone }, w.phone) : 'ไม่มีเบอร์',
      el('span', {}, ` · ${w.any ? 'วันไหนก็ได้' : 'รอวันนี้'}` + (list.some(x => x.service !== w.service) ? ` · ${w.service}` : '')))))));
}

function renderSlots(){
  const data = dayData;
  const svc = data.capacity.find(c => c.id === svcId);
  const byTime = {};
  data.bookings.forEach(b => { if (!byTime[b.time] || b.cancelled === false) byTime[b.time] = b; });

  if (!svc){
    $('list').replaceChildren(...(data.bookings.length
      ? [el('div', { class: 'slots' }, data.bookings.map(b => slotRow(b.time, b, false)))]
      : [el('p', { class: 'empty' }, 'วันนี้ไม่เปิดให้บริการ และไม่มีนัดค้าง')]));
    renderSelbar();
    return;
  }

  $('list').replaceChildren(el('div', { class: 'slots' },
    svc.times.map(t => slotRow(t, byTime[t], svc.free.includes(t)))));
  renderSelbar();
}

function slotRow(t, b, free){
  if (b && !b.cancelled){
    const bits = [];
    if (b.phone) bits.push(el('a', { href: 'tel:' + b.phone }, b.phone));
    bits.push(b.channel === 'LINE' ? 'จองเอง' : (b.channel || 'แอดมิน'));
    if (b.note) bits.push(b.note);
    const line = [];
    bits.forEach((x, i) => { if (i) line.push(' · '); line.push(x); });

    return el('div', { class: 'slot taken' },
      el('div', { class: 't' }, t),
      el('div', { class: 'n' }, el('b', {}, b.name || '—'), el('small', {}, line)),
      el('div', { class: 'side' },
        el('button', { class: 'drop', 'aria-label': `ยกเลิกนัดของ ${b.name || 'คนไข้'}`,
          title: 'ยกเลิกนัดนี้', onclick: () => cancelOne(b) }, '✕')));
  }
  if (b && b.cancelled && !free){
    return el('div', { class: 'slot off' },
      el('div', { class: 't' }, t),
      el('div', { class: 'n' }, el('b', {}, b.name || '—'), el('small', {}, 'ยกเลิกแล้ว')),
      el('div', { class: 'side' }));
  }
  if (!free){
    return el('div', { class: 'slot blocked' },
      el('div', { class: 't' }, t),
      el('div', { class: 'n' }, el('b', {}, 'ไม่ว่าง')),
      el('div', { class: 'side' }));
  }
  const on = picked.includes(t);
  return el('button', {
      class: 'slot vacant', 'aria-pressed': String(on), 'aria-label': `เวลา ${t} ว่าง`,
      onclick: () => {
        picked = on ? picked.filter(x => x !== t) : [...picked, t].sort();
        renderSlots();
      }
    },
    el('div', { class: 't' }, t),
    el('div', { class: 'n' }, el('b', {}, on ? 'เลือกไว้' : 'ว่าง')),
    el('div', { class: 'side' }, on ? '✓' : '+'));
}

function renderSelbar(){
  if (!picked.length){ $('selbar').replaceChildren(); return; }
  $('selbar').replaceChildren(el('div', { class: 'selbar' },
    el('span', {}, `เลือก ${picked.length} คิว · ${picked.join(' , ')}`),
    el('button', { onclick: openAdd }, 'เพิ่มนัด')));
}

/* ---------- เพิ่มนัดแทนคนไข้ ---------- */
function openAdd(){
  const svc = dayData.capacity.find(c => c.id === svcId);
  if (!svc || !picked.length) return;
  $('ad-title').textContent = 'เพิ่มนัดคนไข้';
  $('ad-sub').textContent = `${longDate(dayData.date)} · ${svc.name}`;
  $('ad-note').value = '';
  $('ad-err').textContent = '';
  renderPeople();
  $('adlg').showModal();
}

function renderPeople(){
  const svc = dayData.capacity.find(c => c.id === svcId);

  $('ad-people').replaceChildren(...picked.map((t, i) =>
    el('div', {},
      el('label', {}, picked.length > 1 ? `คนไข้คนที่ ${i+1}` : 'คนไข้'),
      el('div', { class: 'person' },
        el('input', { class: 'nm', type: 'text', maxlength: '60', placeholder: 'ชื่อ-นามสกุล', 'aria-label': `ชื่อคนไข้คนที่ ${i+1}` }),
        el('div', { class: 'when' }, `${t} – ${endOf(t, svc.minutes)}`),
        picked.length > 1
          ? el('button', { class: 'x', type: 'button', 'aria-label': `เอาคิว ${t} ออก`,
              onclick: () => {
                const names = currentNames();
                names.splice(i, 1);
                picked = picked.filter(x => x !== t);
                renderPeople(); renderSlots(); restoreNames(names);
              } }, '✕')
          : el('span', { class: 'x' }),
        el('input', { class: 'ph', type: 'tel', inputmode: 'numeric', maxlength: '12',
          placeholder: i ? 'เบอร์โทร (เว้นว่าง = ใช้เบอร์คนแรก)' : 'เบอร์โทร (ไม่บังคับ) ใช้เบอร์ญาติได้',
          'aria-label': `เบอร์โทรคนที่ ${i+1}` })))));

  const next = svc.free.find(t => !picked.includes(t));
  const more = $('ad-more');
  more.disabled = !next;
  more.textContent = next ? '+ เพิ่มคนไข้อีกคน' : 'ไม่มีคิวว่างเหลือแล้ว';
  more.onclick = () => {
    const names = currentNames();
    picked = [...picked, next].sort();
    renderPeople(); renderSlots(); restoreNames(names);
  };
}

const currentNames = () => [...document.querySelectorAll('#ad-people .person')]
  .map(r => ({ name: r.querySelector('.nm').value, phone: r.querySelector('.ph').value }));
const restoreNames = v => document.querySelectorAll('#ad-people .person').forEach((r, i) => {
  if (!v[i]) return;
  r.querySelector('.nm').value = v[i].name; r.querySelector('.ph').value = v[i].phone;
});

async function submitAdd(){
  const err = m => { $('ad-err').textContent = m; };
  err('');
  const svc = dayData.capacity.find(c => c.id === svcId);
  const people = currentNames().map(x => ({ name: x.name.trim(), phone: x.phone.replace(/\D/g, '') }));
  if (people.some(x => !x.name)) return err('กรอกชื่อคนไข้ให้ครบทุกคน');
  const bad = people.findIndex(x => x.phone && !/^0\d{8,9}$/.test(x.phone));
  if (bad >= 0) return err(`เบอร์โทรของคนที่ ${bad+1} ไม่ถูกต้อง เช่น 0812345678`);
  people.forEach((x, i) => { if (i && !x.phone) x.phone = people[0].phone; });

  $('ad-yes').disabled = true;
  try {
    loading(true);
    const r = await api('adminAdd', {
      date: dayData.date, service: svc.id,
      note: $('ad-note').value.trim(), channel: 'แอดมิน',
      people: picked.map((t, i) => ({ time: t, name: people[i].name, phone: people[i].phone }))
    });
    $('adlg').close();
    toast(`เพิ่ม ${r.added} นัดเรียบร้อย`);
    days = await api('adminDays');
    await openDay(dayData.date);
  } catch (e) {
    err(e.message);
  } finally {
    $('ad-yes').disabled = false;
    loading(false);
  }
}

/* ---------- ปิด / เปิดวัน ---------- */
async function toggleHoliday(data){
  const on = !data.holiday;
  const live = data.bookings.filter(b => !b.cancelled).length;
  if (on && live && await openReschedule(data)) return;
  const r = await ask({
    title: on ? 'ปิดทำการวันนี้?' : 'เปิดทำการอีกครั้ง?',
    text: on
      ? `คนไข้จะไม่เห็น ${longDate(data.date)} ในหน้าจอง` +
        (live ? ` — นัดที่มีอยู่ ${live} รายการจะยังอยู่ ต้องยกเลิกเองทีละรายการ` : '')
      : `คนไข้จะกลับมาจอง ${longDate(data.date)} ได้ตามปกติ`,
    confirm: on ? 'ปิดทำการ' : 'เปิดทำการ',
    placeholder: on ? 'เหตุผล เช่น หมอลา (ไม่บังคับ)' : '',
    safe: !on
  });
  if (!r) return;
  try {
    loading(true);
    await api('adminHoliday', { date: data.date, on, note: r.text });
    toast(on ? 'ปิดทำการแล้ว' : 'เปิดทำการแล้ว');
    days = await api('adminDays');
    await openDay(data.date);
  } catch (e) { toast(e.message); }
  finally { loading(false); }
}


/* ---------- เลื่อนคิวทั้งวันไปวันพฤหัส ---------- */
let rs = null;   // { from, bookings, target, resolve }

function openReschedule(data){
  const targets = days.filter(d => d.extra && !d.holiday && d.date > data.date && d.date >= today).slice(0, 4);
  if (!targets.length) return Promise.resolve(false);       // ไม่มีวันชดเชยให้เลือก → ปิดแบบเดิม
  return new Promise(resolve => {
    rs = { from: data.date, bookings: data.bookings.filter(b => !b.cancelled), target: null, resolve };
    $('rs-sub').textContent = `${longDate(data.date)} มี ${rs.bookings.length} คิว — เลือกเวลาใหม่ให้คนไข้ แล้วระบบจะส่ง LINE แจ้งให้`;
    $('rs-date').replaceChildren(...targets.map(d =>
      el('option', { value: d.date }, longDate(d.date) + (d.count ? ` (มีนัดแล้ว ${d.count})` : ''))));
    $('rs-note').value = '';
    $('rs-err').textContent = '';
    $('rs-list').replaceChildren(el('p', { class: 'empty' }, 'กำลังโหลดคิวว่าง…'));
    $('rdlg').showModal();
    loadTarget();
  });
}

async function loadTarget(){
  const to = $('rs-date').value;
  $('rs-err').textContent = '';
  try { rs.target = await api('adminDay', { date: to }); }
  catch (e) { $('rs-err').textContent = e.message; return; }
  if ($('rs-date').value !== to) return;

  const taken = new Set();
  $('rs-list').replaceChildren(...rs.bookings.map(b => {
    const cap = rs.target.capacity.find(c => c.name === b.service);
    const free = cap ? cap.free : [];
    const pick = free.includes(b.time) && !taken.has(b.time) ? b.time : (free.find(t => !taken.has(t)) || '');
    if (pick) taken.add(pick);
    return el('div', { class: 'rs-row' },
      el('div', {}, el('b', {}, b.name || '—'),
        el('small', {}, `เดิม ${b.time} · ${b.service}` + (b.hasLine ? '' : ' · ไม่มี LINE'))),
      el('select', { 'data-id': b.id, 'aria-label': `เวลาใหม่ของ ${b.name || 'คนไข้'}` },
        el('option', { value: '' }, cap ? '— เลือกเวลา —' : 'ไม่มีรอบนี้'),
        free.map(t => el('option', { value: t, selected: t === pick }, t))));
  }));
}

function closeReschedule(result){
  if (!rs) return;
  const r = rs; rs = null;
  $('rdlg').close();
  r.resolve(result);
}

async function submitReschedule(){
  const err = m => { $('rs-err').textContent = m; };
  const sel = [...$('rs-list').querySelectorAll('select')];
  const moves = sel.map(x => ({ id: x.dataset.id, time: x.value }));
  if (!moves.length || moves.some(m => !m.time)) return err('เลือกเวลาใหม่ให้ครบทุกคน');
  if (new Set(moves.map(m => m.time)).size !== moves.length) return err('มีคนไข้ได้เวลาซ้ำกัน');

  const to = $('rs-date').value, from = rs.from;
  $('rs-yes').disabled = true;
  try {
    loading(true);
    const r = await api('adminReschedule', { from, to, moves, close: true, note: $('rs-note').value.trim() });
    closeReschedule(true);
    days = await api('adminDays');
    await openDay(r.to);
    loading(false);
    if (r.callList.length){
      await ask({
        title: `เลื่อน ${r.moved} คิวแล้ว — ต้องโทรแจ้ง ${r.callList.length} คน`,
        text: 'คนไข้เหล่านี้ไม่มี LINE:\n' + r.callList.map(c => `• ${c.name || '—'}  ${c.phone || 'ไม่มีเบอร์'}  → ${c.time} น.`).join('\n'),
        confirm: 'รับทราบ', safe: true
      });
    } else {
      toast(`เลื่อน ${r.moved} คิวไป ${longDate(r.to)} แล้ว แจ้งทาง LINE ครบทุกคน`);
    }
  } catch (e) {
    err(e.message);
  } finally {
    $('rs-yes').disabled = false;
    loading(false);
  }
}

/* ---------- ยกเลิกนัด ---------- */
async function cancelOne(b){
  const r = await ask({
    title: `ยกเลิกนัดของ ${b.name || 'คนไข้'}`,
    text: `${b.service} เวลา ${b.time} น.` +
          (b.hasLine ? ' — ระบบจะส่งข้อความแจ้งทาง LINE' : ' — คนไข้รายนี้ไม่มี LINE ต้องโทรแจ้งเอง'),
    confirm: 'ยกเลิกนัด',
    placeholder: 'เหตุผลที่แจ้งคนไข้ (ไม่บังคับ)'
  });
  if (!r) return;
  try {
    loading(true);
    const res = await api('adminCancel', { id: b.id, reason: r.text });
    toast(res.notified ? 'ยกเลิกแล้ว แจ้งคนไข้ทาง LINE เรียบร้อย'
                       : 'ยกเลิกแล้ว — กรุณาโทรแจ้งคนไข้ด้วย');
    days = await api('adminDays');
    await openDay(current);
  } catch (e) { toast(e.message); }
  finally { loading(false); }
}


/* ---------- ค้นหาคนไข้ ---------- */
let searchTimer, searchSeq = 0;
const shortDate = ds => { const p = parts(ds); return `${WD_S[p.w]}. ${p.d} ${MON[p.m-1]} ${String(p.y+543).slice(2)}`; };

function clearSearch(){
  $('q').value = ''; $('results').hidden = true; $('results').replaceChildren();
}

async function runSearch(){
  const q = $('q').value.trim();
  if (q.replace(/\s/g, '').length < 2){ $('results').hidden = true; return; }
  const seq = ++searchSeq;
  $('results').hidden = false;
  $('results').replaceChildren(el('p', { class: 'none' }, 'กำลังค้นหา…'));
  let r;
  try { r = await api('adminSearch', { q }); }
  catch (e) { if (seq === searchSeq) $('results').replaceChildren(el('p', { class: 'none' }, e.message)); return; }
  if (seq !== searchSeq) return;

  const head = el('div', { class: 'rhead' },
    el('span', {}, r.total ? `พบ ${r.total} นัด` + (r.total > r.items.length ? ` (แสดง ${r.items.length} ล่าสุด)` : '') : ''),
    el('button', { onclick: clearSearch }, 'ปิด'));
  if (!r.items.length){
    $('results').replaceChildren(head, el('p', { class: 'none' }, `ไม่พบ "${q}"`));
    return;
  }
  $('results').replaceChildren(head, ...r.items.map(b => {
    const tag = b.cancelled ? el('span', { class: 'tag off' }, 'ยกเลิก')
      : b.date >= r.today ? el('span', { class: 'tag up' }, 'จะถึง')
      : el('span', { class: 'tag past' }, 'ผ่านแล้ว');
    const sub = [b.phone, b.service, b.note].filter(Boolean).join(' · ');
    return el('button', { class: 'hit', onclick: () => { clearSearch(); openDay(b.date); } },
      el('div', { class: 'when' }, shortDate(b.date), el('small', {}, b.time + ' น.')),
      el('div', { class: 'who' }, el('b', {}, b.name || '—'), tag, el('small', {}, sub)));
  }));
}

/* ---------- เริ่มต้น ---------- */
function showLogin(msg){
  $('main').hidden = true;
  $('gate').hidden = true;
  $('strip').replaceChildren();
  $('searchbox').hidden = true; clearSearch();
  $('login').hidden = false;
  $('lg-err').textContent = msg || '';
  $('lg-pw').focus();
  loading(false);
}

async function start(info){
  $('login').hidden = true;
  $('clinic').textContent = info.clinicName;
  $('pclinic').textContent = info.clinicName + ' — ตารางคิว';
  $('logout').hidden = !adminToken;
  $('searchbox').hidden = false;
  today = info.today;
  days = await api('adminDays');
  renderStrip();
  await openDay(days.some(d => d.date === today) ? today
    : (days.find(d => d.date >= today) || days[0] || {}).date || today);
}

async function doLogin(){
  const pw = $('lg-pw').value;
  if (!pw) { $('lg-err').textContent = 'ใส่รหัสผ่านก่อน'; return; }
  $('lg-go').disabled = true;
  try {
    loading(true);
    const r = await api('adminLogin', { password: pw });
    adminToken = r.token; saveToken(r.token);
    $('lg-pw').value = '';
    await start(r);
  } catch (e) {
    $('lg-err').textContent = e.message;
  } finally {
    $('lg-go').disabled = false;
    loading(false);
  }
}

async function init(){
  $('ad-yes').addEventListener('click', submitAdd);
  $('ad-no').addEventListener('click', () => $('adlg').close());
  $('lg-go').addEventListener('click', doLogin);
  $('print').addEventListener('click', () => window.print());
  $('rs-date').addEventListener('change', loadTarget);
  $('rs-yes').addEventListener('click', submitReschedule);
  $('rs-no').addEventListener('click', () => closeReschedule(true));      // ย้อนกลับ = ไม่ทำอะไร
  $('rs-skip').addEventListener('click', () => closeReschedule(false));   // ไปทางปิดวันแบบเดิม
  $('rdlg').addEventListener('cancel', e => { e.preventDefault(); closeReschedule(true); });
  $('q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 450); });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ clearTimeout(searchTimer); runSearch(); }
    if (e.key === 'Escape') clearSearch();
  });
  $('lg-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logout').addEventListener('click', () => {
    adminToken = null; clearToken(); showLogin('ออกจากระบบแล้ว');
  });

  if (API_URL.startsWith('ใส่')){
    $('gate').textContent = 'ยังไม่ได้ใส่ API_URL ในไฟล์ admin.html';
    $('gate').hidden = false; loading(false); return;
  }

  // 1) เคยเข้าด้วยรหัสผ่านไว้แล้ว
  adminToken = readToken();
  if (adminToken){
    try { return await start(await api('adminInit')); }
    catch (_) { adminToken = null; clearToken(); }
  }

  // 2) เปิดผ่าน LINE
  try {
    if (LIFF_ID.startsWith('ใส่')) throw new Error('no liff');
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()){
      idToken = liff.getIDToken();
      return await start(await api('adminInit'));
    }
    if (liff.isInClient()){ liff.login({ redirectUri: location.href }); return; }
  } catch (_) { /* เปิดนอก LINE — ใช้รหัสผ่านแทน */ }

  // 3) ให้ใส่รหัสผ่าน
  idToken = null;
  showLogin('');
}
init();
</script>
